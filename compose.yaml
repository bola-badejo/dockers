#this works best for Node + Mongo + React

services:
  api:
    build: { context: ./api, target: runtime }
    ports: ["3000:3000"]
    environment:
      MONGO_URL: mongodb://mongo:27017/app
    depends_on: [mongo]

  web:
    build: { context: ./web }
    ports: ["80:80"]
    depends_on: [api]

  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]

volumes:
  mongo-data: